<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" role="img">
<title>3d-warehouse 模块分层结构</title>
<desc>组装层 main.js 位于顶部，向下依赖业务层、渲染层与最底层的基础模块；箭头表示依赖方向，当前端不直接接触数据源。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="500" fill="#ffffff"/>

<text x="40" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">3d-warehouse 模块结构（依赖只向下，不成环）</text>

<rect x="40" y="40" width="600" height="72" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#534AB7">组装层 · 172 行</text>
<rect x="56" y="68" width="200" height="30" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="156" y="83" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">main.js　接线 + 启动</text>
<text x="276" y="83" font-family="system-ui, sans-serif" font-size="12" fill="#534AB7" dominant-baseline="central">只做组装：绑定界面事件、启动渲染循环</text>

<rect x="40" y="128" width="600" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56">业务层 · 功能各自独立，互不调用</text>
<rect x="56" y="156" width="132" height="42" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="122" y="171" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">search.js</text>
<text x="122" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#085041" text-anchor="middle" dominant-baseline="central">搜索规则 86 行</text>
<rect x="200" y="156" width="132" height="42" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="266" y="171" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">emphasis.js</text>
<text x="266" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#085041" text-anchor="middle" dominant-baseline="central">高亮定位 98 行</text>
<rect x="344" y="156" width="132" height="42" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="410" y="171" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">panel.js</text>
<text x="410" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#085041" text-anchor="middle" dominant-baseline="central">DOM 唯一出口 155 行</text>
<rect x="488" y="156" width="136" height="42" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="556" y="171" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">controls.js</text>
<text x="556" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#085041" text-anchor="middle" dominant-baseline="central">鼠标 + 触摸 123 行</text>
<text x="56" y="226" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56">加功能只挑对应那一个文件改，不牵动其他层</text>

<rect x="40" y="258" width="600" height="86" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="276" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5">渲染层 · 只管画面</text>
<rect x="56" y="286" width="150" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="131" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">scene.js</text>
<text x="131" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">渲染基建 + 场景 237 行</text>
<rect x="218" y="286" width="150" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="293" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">camera.js</text>
<text x="293" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">相机运动 + 动画 142 行</text>
<rect x="380" y="286" width="122" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="441" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">minimap.js</text>
<text x="441" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">已停用，可整删 71 行</text>
<rect x="514" y="286" width="110" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="569" y="301" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">api.js</text>
<text x="569" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">测试接口 77 行</text>

<rect x="40" y="352" width="600" height="80" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="370" font-family="system-ui, sans-serif" font-size="12" fill="#854F0B">基础层 · 无内部依赖，被所有上层读取</text>
<rect x="56" y="380" width="132" height="36" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="122" y="393" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">config.js</text>
<text x="122" y="407" font-family="system-ui, sans-serif" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">可调参数 49 行</text>
<rect x="200" y="380" width="132" height="36" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="266" y="393" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">state.js</text>
<text x="266" y="407" font-family="system-ui, sans-serif" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">会变的数据 44 行</text>
<rect x="344" y="380" width="132" height="36" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="410" y="393" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">layout.js</text>
<text x="410" y="407" font-family="system-ui, sans-serif" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">坐标唯一来源 81 行</text>
<rect x="488" y="380" width="136" height="36" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="556" y="393" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">adapter.js</text>
<text x="556" y="407" font-family="system-ui, sans-serif" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">外部数据翻译 80 行</text>

<rect x="40" y="444" width="600" height="44" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="56" y="461" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">数据来源（旁路，前端永不直连）</text>
<text x="56" y="477" font-family="system-ui, sans-serif" font-size="12" fill="#444441">腾讯文档 / 本地快照　→　backend/server.py（持凭据）　→　adapter.js　→　页面</text>

<path d="M340 112 L340 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 248 L340 258" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 344 L340 352" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
